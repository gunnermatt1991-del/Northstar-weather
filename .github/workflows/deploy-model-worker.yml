name: Deploy Northstar Model Data Worker
on:
  push:
    branches: [main]
    paths: ["model-service/**", ".github/workflows/deploy-model-worker.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install --global wrangler@4
      - name: Deploy development model Worker
        working-directory: model-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy
