name: Deploy Northstar Model Data Worker
on:
  push:
    branches: [main]
    paths: ["model-service/**", ".github/workflows/deploy-model-worker.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install --global wrangler@4
      - name: Deploy model Worker and configure API key
        working-directory: model-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
        run: |
          wrangler deploy
          if [ -z "$OPEN_METEO_API_KEY" ]; then echo "Missing OPEN_METEO_API_KEY GitHub secret"; exit 1; fi
          printf '%s' "$OPEN_METEO_API_KEY" | wrangler secret put OPEN_METEO_API_KEY
