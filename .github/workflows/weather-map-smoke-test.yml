name: Northstar map temperature smoke test

on:
  push:
    branches: [main]
    paths:
      - "Northstar-UK-Map-Fixed 2.html"
      - "cloudflare/worker.js"
      - ".github/workflows/weather-map-smoke-test.yml"
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check multi-location weather providers
        env:
          NORTHSTAR_PROXY: https://northstar-weather-alerts.gunnermatt1991.workers.dev/weather/forecast
          WEATHER_MIRROR: https://weather.tk.gg/v1/forecast
        run: |
          node <<'NODE'
          // Exact locations reported missing on the latest iPhone map screenshot.
          const locations = [
            ["Liverpool", 53.4084, -2.9916], ["Dublin", 53.3498, -6.2603],
            ["Sheffield", 53.3811, -1.4701], ["Paris", 48.8566, 2.3522],
            ["Brussels", 50.8503, 4.3517], ["Amsterdam", 52.3676, 4.9041],
            ["Copenhagen", 55.6761, 12.5683], ["Zurich", 47.3769, 8.5417],
            ["Rome", 41.9028, 12.4964], ["Madrid", 40.4168, -3.7038]
          ];
          const params = new URLSearchParams({
            latitude: locations.map(x => x[1]).join(","),
            longitude: locations.map(x => x[2]).join(","),
            current: "temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m,is_day,cloud_cover,pressure_msl,precipitation,rain,showers,snowfall",
            hourly: "visibility",
            timezone: "auto"
          });
          async function check(name, base) {
            const url = base + "?" + params;
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 25000);
            try {
              const response = await fetch(url, { signal: controller.signal, headers: { accept: "application/json", origin: "https://gunnermatt1991-del.github.io" } });
              const raw = await response.text();
              let data; try { data = JSON.parse(raw); } catch {}
              const items = Array.isArray(data) ? data : [data];
              const valid = Array.isArray(data) && data.length === locations.length &&
                items.every(x => x && x.current && Number.isFinite(Number(x.current.temperature_2m)));
              console.log(JSON.stringify({
                provider: name, status: response.status, isArray: Array.isArray(data),
                locationsReturned: Array.isArray(data) ? data.length : 1,
                validTemperatures: valid,
                sample: locations.map((loc, i) => ({ city: loc[0], temperature: items[i]?.current?.temperature_2m ?? null })),
                error: data?.reason || data?.error || (!response.ok ? raw.slice(0, 300) : null)
              }));
              if (!response.ok || !valid) process.exitCode = 1;
            } catch (error) {
              console.log(JSON.stringify({ provider: name, error: error.name + ": " + error.message }));
              process.exitCode = 1;
            } finally { clearTimeout(timer); }
          }
          // The mirror is known to stall intermittently; the Northstar Worker
          // has a bounded timeout and falls back to the official provider.
          // Gate this check on the actual app-facing Worker response only.
          await check("northstar-worker", process.env.NORTHSTAR_PROXY);
          async function checkRadarTiles() {
            const response = await fetch("https://api.rainviewer.com/public/weather-maps.json", { cache: "no-store" });
            if (!response.ok) throw Error("RainViewer metadata HTTP " + response.status);
            const manifest = await response.json();
            const frame = manifest.radar?.past?.at(-1);
            if (!manifest.host || !frame?.path) throw Error("RainViewer returned no latest radar frame");
            // Kettering at the map's default zoom (5): use the same zoom in the URL
            // and tile coordinates so the tile's geography is checked correctly.
            const z = 5, lat = 52.3984, lon = -0.7283, n = 2 ** z;
            const x = Math.floor((lon + 180) / 360 * n);
            const y = Math.floor((1 - Math.asinh(Math.tan(lat * Math.PI / 180)) / Math.PI) / 2 * n);
            const tileUrl = manifest.host + frame.path + "/256/" + z + "/" + x + "/" + y + "/2/1_1.png";
            const tile = await fetch(tileUrl, { cache: "no-store" });
            const bytes = await tile.arrayBuffer();
            const type = tile.headers.get("content-type") || "";
            console.log(JSON.stringify({ provider: "rainviewer-tile", status: tile.status, contentType: type, bytes: bytes.byteLength, frame: frame.path, tile: [z, x, y] }));
            if (!tile.ok || !type.includes("image/png") || bytes.byteLength < 100) throw Error("RainViewer radar tile failed");
          }
          await checkRadarTiles();
          NODE
