name: Configure and deploy Northstar push notifications

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Worker dependencies
        working-directory: cloudflare
        run: npm install --no-audit --no-fund

      - name: Configure Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Add CLOUDFLARE_API_TOKEN to GitHub Actions secrets."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Add CLOUDFLARE_ACCOUNT_ID to GitHub Actions secrets."; exit 1; }

      - name: Apply notification database schema
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute northstar-notifications --remote --file=schema.sql

      - name: Generate and install VAPID credentials if missing
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          HEALTH="$(curl --fail --silent --show-error https://northstar-weather-alerts.gunnermatt1991.workers.dev/health)"
          if node -e 'const h=JSON.parse(process.argv[1]);process.exit(h.vapidConfigured ? 0 : 1)' "$HEALTH"; then
            echo "VAPID is already configured; preserving existing credentials."
            exit 0
          fi
          KEYS="$(npx web-push generate-vapid-keys --json)"
          PUBLIC_KEY="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).publicKey)' "$KEYS")"
          PRIVATE_KEY="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).privateKey)' "$KEYS")"
          echo "::add-mask::$PUBLIC_KEY"
          echo "::add-mask::$PRIVATE_KEY"
          printf '%s' "$PUBLIC_KEY" | npx wrangler secret put VAPID_PUBLIC_KEY
          printf '%s' "$PRIVATE_KEY" | npx wrangler secret put VAPID_PRIVATE_KEY
          printf '%s' 'https://gunnermatt1991-del.github.io/Northstar-weather/' | npx wrangler secret put VAPID_SUBJECT

      - name: Deploy notification Worker
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify live push configuration
        run: |
          set -euo pipefail
          HEALTH="$(curl --fail --silent --show-error https://northstar-weather-alerts.gunnermatt1991.workers.dev/health)"
          echo "$HEALTH"
          node -e 'const h=JSON.parse(process.argv[1]); if (!h.ok || !h.vapidConfigured || !h.databaseConfigured) process.exit(1)' "$HEALTH"
          echo "Worker reports VAPID and database configured. A real-device delivery test is still required."
